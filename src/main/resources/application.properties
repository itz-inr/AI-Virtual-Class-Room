# Server Configuration
server.port=8082
spring.application.name=AI Classroom Platform

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_classroom
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://localhost:8082

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.aiclassroom=DEBUG
logging.level.org.springframework.security=DEBUG

# Initialize database scripts after datasource
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# ── Groq AI (Llama 3 70B — free, fast, accurate) ──────────────────────────
# Get a free key at: https://console.groq.com/keys
groq.api-key=${GROQ_API_KEY}
groq.model=openai/gpt-oss-120b
